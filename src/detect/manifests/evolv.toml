id = "evolv"
version = "2026.08.19.1"
min_engine_version = 1
updated_at = "2026-08-19T00:00:00Z"
aliases = ["dsh-evolv"]

# evolv attach is OUR protocol client for the dsh web host (evolv-herd project),
# so it broadcasts its state instead of being reverse-engineered: the client
# emits an OSC title on every state transition and the title alone is
# authoritative. Grammar (attach.mjs refreshTitle, sanitized to one line):
#   working  "⠿ evolv · <session title>"   braille prefix, matches claude's convention
#   blocked  "⏸ evolv · approval|question" pending approval/question frame
#   idle     "✳ evolv · <session title>"   no open turn, nothing pending
# Screen-content rules are deliberately absent: the pane body is a scrolling
# tail of model-generated text and must never drive state.

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 900
region = "osc_title"
visible_blocker = true
regex = ['^⏸ evolv ']

[[rules]]
id = "osc_title_working"
state = "working"
priority = 500
region = "osc_title"
visible_working = true
regex = ['^[\x{2800}-\x{28FF}] evolv ']

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 250
region = "osc_title"
visible_idle = true
regex = ['^✳ evolv ']
