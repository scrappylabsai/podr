# podsh overlay: ONE host, every model your Ollama endpoint can actually reach.
#
#   export DEEPSEEK_BASE_URL=http://127.0.0.1:11434/v1
#   export PODSH_PATCH=$PWD/podsh/examples/ollama-everything.patch.yml
#   podsh web --port 3092
#
# Why this exists: a dsh host is one endpoint — the llm-deepseek plugin registers
# the fixed provider route "deepseek-official", so you cannot mount it twice with
# different baseURLs. But ONE endpoint can front many models, and Ollama resolves
# :cloud models on demand, so they need not be pulled to appear here.
#
# EVERY MODEL BELOW WAS PROBED against a live endpoint before being listed. Do the
# same when you edit this: dsh's own default catalog is advisory (it advertises
# V4 Flash *and* V4 Pro whatever your endpoint has), and an unreachable model looks
# perfectly selectable right up until the turn 404s.
#
# Two traps worth knowing:
#   - cloud models need the `:cloud` tag. The library page lists `qwen3.5:397b`,
#     but the resolvable id is `qwen3.5:cloud`. Bare names mostly do not work.
#   - some library entries do not resolve at all (mistral-large-3, gpt-oss were
#     both "not found" on 2026-08-19), and some bill extra usage rather than plan
#     usage (kimi-k3 → "extra usage balance is empty"). Probe, do not assume.
#
# NAME THE LOCALITY. The picker shows only the display name, so "DeepSeek-V4-Flash"
# on a cloud endpoint and the same model on your own GPU are indistinguishable —
# which matters when one of them is private and the other is not. Convention here:
#   ☁ cloud   leaves your machine
#   ⌂ <host>  served by a machine you run (see sparks-vllm.patch.yml)
#
# Ollama caps output at 65536; dsh's 256000 default is a hard 400.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    maxTokens: 65536
    models:
      - { id: deepseek-v4-flash:cloud, name: DeepSeek-V4-Flash ☁ cloud, contextWindow: 1000000, maxTokens: 65536 }
      - { id: deepseek-v4-pro:cloud,   name: DeepSeek-V4-Pro ☁ cloud,   contextWindow: 524288,  maxTokens: 65536 }
      - { id: glm-5.2:cloud,           name: GLM-5.2 ☁ cloud,           contextWindow: 200000,  maxTokens: 65536 }
      - { id: glm-5.1:cloud,           name: GLM-5.1 ☁ cloud,           contextWindow: 200000,  maxTokens: 65536 }
      - { id: qwen3.5:cloud,           name: Qwen3.5 ☁ cloud,           contextWindow: 262144,  maxTokens: 65536 }
      - { id: minimax-m3:cloud,        name: MiniMax-M3 ☁ cloud,        contextWindow: 200000,  maxTokens: 65536 }
      - { id: nemotron-3-super:cloud,  name: Nemotron-3-Super ☁ cloud,  contextWindow: 131072,  maxTokens: 65536 }
      - { id: kimi-k2.7-code:cloud,    name: Kimi-K2.7-Code ☁ cloud,    contextWindow: 262144,  maxTokens: 65536 }
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash:cloud
